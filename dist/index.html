<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Visor KML Premium</title>
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <script type="module" crossorigin src="/assets/index-CAWH26Dx.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-CSq_G4AU.css">
  </head>
  <body>
    <div id="app">
      <div class="sidebar">
        <header>
          <h1>KML Explorer</h1>
          <p>Sube tu archivo KML para visualizarlo en el mapa</p>
        </header>
        
        <div class="upload-container">
          <label for="kml-upload" class="upload-button">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
            Seleccionar archivo KML / KMZ
          </label>
          <input type="file" id="kml-upload" accept=".kml,.kmz" />
          <span id="file-name" class="file-name">Ningún archivo seleccionado</span>
        </div>
        
        <div class="info-panel" id="info-panel">
          <h3>Detalles del KML</h3>
          <div id="kml-details">
            <p class="empty-state">Carga un archivo para ver detalles</p>
          </div>
        </div>
      </div>
      <div class="map-container">
        <div id="map"></div>
        <button id="locate-btn" class="locate-btn" title="Mi ubicación">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="3 11 22 2 13 21 11 13 3 11"></polygon></svg>
        </button>
      </div>
    </div>
  </body>
</html>
